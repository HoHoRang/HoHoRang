name: Latest blog posts

# 블로그 RSS를 읽어 README의 BLOG-POST-LIST 구간을 갱신한다.
on:
  schedule:
    - cron: '0 0 * * *' # 매일 09:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul # 글 날짜를 한국 시간 기준으로 표시
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: https://hohorang.github.io/rss.xml
          max_post_count: 5
          template: '- [$title]($url) <sub>$date</sub>$newline'
          date_format: 'yyyy.mm.dd'
          tag_post_pre_newline: true
          commit_message: 'Update latest blog posts'
